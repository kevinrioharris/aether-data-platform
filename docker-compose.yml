name: lakehouse

services:
  # ── Source system: the "shop" OLTP database (CDC source) ─────────────────────
  postgres-source:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_DB: ${SHOP_DB_NAME}
      POSTGRES_USER: ${SHOP_DB_USER}
      POSTGRES_PASSWORD: ${SHOP_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ./infra/postgres-source/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/postgres-source/migrations/001_local_currency_prices.sql:/docker-entrypoint-initdb.d/02-local-currency-prices.sql:ro
      - shop-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHOP_DB_USER} -d ${SHOP_DB_NAME}"]
      interval: 5s
      retries: 10

  # ── Streaming backbone: Kafka in KRaft mode (no ZooKeeper) ───────────────────
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 10

  # ── CDC: Debezium running on Kafka Connect ───────────────────────────────────
  kafka-connect:
    image: quay.io/debezium/connect:2.7
    depends_on:
      kafka: { condition: service_healthy }
      postgres-source: { condition: service_healthy }
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    ports:
      - "8085:8080"

  # ── Lakehouse storage: RustFS (S3-compatible, MinIO-like) holding Delta tables ─
  object-storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000"]
      interval: 5s
      retries: 20

  storage-init:
    image: amazon/aws-cli:latest
    depends_on:
      object-storage: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for b in landing bronze silver gold; do
        aws --endpoint-url http://object-storage:9000 s3api head-bucket --bucket $$b 2>/dev/null ||
        aws --endpoint-url http://object-storage:9000 s3 mb s3://$$b || exit 1;
        done; echo buckets ready

  # ── Orchestration: Airflow (standalone: api-server + scheduler + dag-processor + triggerer) ─
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 10

  airflow:
    build: infra/airflow
    command: standalone
    depends_on:
      airflow-db: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"  # local dev: no login
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: 30
      PYTHONPATH: /opt/project
      # Reach the other services by their compose names instead of localhost.
      S3_ENDPOINT_URL: http://object-storage:9000
      SHOP_DB_HOST: postgres-source
      SHOP_DB_PORT: 5432
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dataplatform:/opt/project/dataplatform
      - ./config:/opt/project/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v2/monitor/health > /dev/null"]
      interval: 15s
      retries: 20

  # ── Pipeline: CDC consumer (Kafka → bronze Delta). Start with `make consume-docker`
  cdc-consumer:
    build: .
    profiles: ["pipeline"]
    command: ["python", "-m", "dataplatform.bronze.cdc_consumer"]
    depends_on:
      kafka: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT_URL: http://object-storage:9000
    restart: unless-stopped

volumes:
  shop-db:
  kafka-data:
  object-data:
  airflow-db:
