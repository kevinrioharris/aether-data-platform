[project]
name = "dataplatform"
version = "0.1.0"
description = "Laptop-sized lakehouse: CDC + files + APIs → Delta Lake medallion layers"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5",
    "deltalake>=0.22",
    "pyarrow>=17",
    "polars>=1.0",
    "duckdb>=1.5",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "obstore>=0.8",
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dataplatform*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # inline fixture rows read better unwrapped
